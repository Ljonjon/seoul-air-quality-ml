name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax check all modules
        run: python -m compileall -q .
      - name: Run regression tests on synthetic data
        # The Kaggle dataset is not redistributed here, so CI runs the
        # pipeline against a synthetic fixture (tests/test_pipeline.py) that
        # reproduces the three source CSVs and pins the leakage fixes.
        run: pytest -q -p no:warnings
